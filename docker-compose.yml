# Production image stack. Rebuild app services with update-production.ps1.
services:
  # Database PostgreSQL
  postgres:
    image: postgres:15-alpine
    container_name: getthawa-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: getthawa
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d getthawa"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Backend API
  backend:
    build:
      context: ./getthawha-backend-main
      dockerfile: Dockerfile
    container_name: getthawa-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - ./getthawha-backend-main/.env
    environment:
      - HOST=postgres
    depends_on:
      postgres:
        condition: service_healthy

  # Client Frontend
  client-frontend:
    build:
      context: ./getthawha-client-frontend-main
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
    container_name: getthawa-client-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    env_file:
      - ./getthawha-client-frontend-main/.env
    environment:
      - INTERNAL_API_URL=http://backend:8000
    depends_on:
      - backend

  # Admin Frontend
  admin-frontend:
    build:
      context: ./getthawha-admin-frontend-main
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:8000}
    container_name: getthawa-admin-frontend
    restart: unless-stopped
    ports:
      - "3001:3000"
    env_file:
      - ./getthawha-admin-frontend-main/.env
    environment:
      - INTERNAL_API_URL=http://backend:8000
    depends_on:
      - backend

volumes:
  postgres_data:
