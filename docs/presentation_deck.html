    let currentSlide = 0;
    let notesVisible = true;

    function renderSlide() {
      const s = slides[currentSlide];
      document.getElementById('slideIndicator').innerText = `Slide ${currentSlide + 1} / ${slides.length} • Point ${s.point}`;
      
      const canvas = document.getElementById('slideCanvas');
      canvas.innerHTML = `
        <div class="space-y-1 mb-4">
          <div class="flex items-center gap-2">
            <span class="px-2 py-0.5 bg-[#F59E0B] text-[#1e130e] text-[11px] font-bold rounded">POINT ${s.point}</span>
            <span class="text-xs text-[#DCA900] tracking-wider uppercase font-semibold">Sprint 1 Evaluation</span>
          </div>
          <h2 class="text-xl md:text-2xl font-bold text-[#DCA900]">${s.title}</h2>
          <p class="text-xs text-[#A3A3A3] italic">${s.subtitle}</p>
        </div>
        <div class="flex-grow flex flex-col justify-center">
          ${s.body}
        </div>
      `;

      document.getElementById('speakerNotes').innerHTML = s.notes;

      // Update buttons
      document.getElementById('prevBtn').disabled = currentSlide === 0;
      document.getElementById('nextBtn').disabled = currentSlide === slides.length - 1;

      // Update pills
      renderPills();
    }

    function renderPills() {
      const container = document.getElementById('pillsContainer');
      container.innerHTML = slides.map((s, idx) => `
        <button onclick="goToSlide(${idx})" class="w-7 h-7 text-xs rounded-full font-bold transition flex items-center justify-center ${idx === currentSlide ? 'bg-[#DCA900] text-[#1e130e] scale-110 shadow-lg' : 'bg-[#382218] text-[#D4D4D4] hover:bg-[#DCA900]/40'}">
          ${s.point}
        </button>
      `).join('');
    }

    function nextSlide() {
      if (currentSlide < slides.length - 1) {
        currentSlide++;
        renderSlide();
      }
    }

    function prevSlide() {
      if (currentSlide > 0) {
        currentSlide--;
        renderSlide();
      }
    }

    function goToSlide(idx) {
      currentSlide = idx;
      renderSlide();
    }

    function toggleNotes() {
      const el = document.getElementById('speakerNotes');
      const chev = document.getElementById('notesChevron');
      notesVisible = !notesVisible;
      el.style.display = notesVisible ? 'block' : 'none';
      chev.innerText = notesVisible ? '▼' : '▲';
    }

    function copySlideContent() {
      const s = slides[currentSlide];
      const text = `POINT ${s.point}: ${s.title}\nSubtitle: ${s.subtitle}\n\nSPEAKER NOTE:\n${s.notes}`;
      navigator.clipboard.writeText(text).then(() => {
        alert(`คัดลอกเนื้อหา Point ${s.point} สำหรับนำไปวางใน Canva เรียบร้อยแล้ว!`);
      });
    }

    // Keyboard navigation
    document.addEventListener('keydown', (e) => {
      if (e.key === 'ArrowRight' || e.key === ' ') nextSlide();
      if (e.key === 'ArrowLeft') prevSlide();
    });

    // Initial render
    renderSlide();
  </script>
